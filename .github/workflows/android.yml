name: Android build
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Also build a signed release AAB (needs KEYSTORE_* secrets)"
        type: boolean
        default: false
  push:
    branches: [main, "claude/**"]
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: node scripts/android-setup.js
      - run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: orbfall-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release-aab:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - run: KEYSTORE_PATH="$RUNNER_TEMP/release.keystore" node scripts/android-setup.js
      - run: npx cap sync android
      - name: Build release AAB
        run: cd android && chmod +x gradlew && KEYSTORE_PATH="$RUNNER_TEMP/release.keystore" ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: orbfall-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
